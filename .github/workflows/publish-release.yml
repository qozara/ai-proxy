name: Publish to NPM
on:
  push:
    branches:
      - main
    paths:
      - 'packages/client/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Trusted Publishing

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build --workspace=@qozara/ai-client

      - name: Publish Client Package
        run: |
          cd packages/client
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @qozara/ai-client@$LOCAL_VERSION version 2>/dev/null || echo "")
          if [ -z "$PUBLISHED" ]; then
            echo "Publishing @qozara/ai-client@$LOCAL_VERSION..."
            npm publish --provenance --access public
          else
            echo "Version $LOCAL_VERSION is already published. Skipping."
          fi
